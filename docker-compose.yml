# Wakeel — one-click stack.
#   Default:            docker compose up -d
#   With a local model: docker compose --profile local-ai up -d
#     (runs Ollama next to Wakeel; then pick "OpenAI-compatible" in the
#      dashboard with Base URL http://ollama:11434/v1)
services:
  wakeel:
    build: .
    image: wakeel:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
    volumes:
      - wakeel-data:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

volumes:
  wakeel-data:
  ollama-data:
