# One-click deploy on a Hostinger VPS (Docker Manager), or anywhere with Docker:
#   docker compose up -d
# Then open http://YOUR-SERVER-IP and create your password.
#
# Optional private AI model running next to Wakeel:
#   docker compose --profile local-ai up -d
#   docker compose exec ollama ollama pull qwen3:8b
#   then in the dashboard: AI model -> OpenAI-compatible, Base URL http://ollama:11434/v1
services:
  wakeel:
    image: ghcr.io/mashraf1997/wakeel:latest
    container_name: wakeel
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - wakeel-data:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

volumes:
  wakeel-data:
  ollama-data:
